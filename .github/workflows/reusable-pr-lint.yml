name: Reusable PR & Commit Linter

on:
  workflow_call:
    inputs:
      check-pr-title:
        description: "Whether to validate PR title convention"
        required: false
        type: boolean
        default: true
      check-branch-name:
        description: "Whether to validate branch name convention"
        required: false
        type: boolean
        default: true
      check-commits:
        description: "Whether to validate commit message conventions"
        required: false
        type: boolean
        default: true
      check-pr-body:
        description: "Whether to validate PR body template convention"
        required: false
        type: boolean
        default: true

jobs:
  validate:
    name: Validate PR & Commit Conventions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Conventions
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BRANCH_NAME: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          CHECK_PR_TITLE: ${{ inputs.check-pr-title }}
          CHECK_BRANCH: ${{ inputs.check-branch-name }}
          CHECK_COMMITS: ${{ inputs.check-commits }}
          CHECK_PR_BODY: ${{ inputs.check-pr-body }}
        run: |
          python3 - << 'EOF'
          import os
          import re
          import subprocess
          import sys

          pr_title = os.environ.get("PR_TITLE", "").strip()
          pr_body = os.environ.get("PR_BODY", "").strip()
          branch_name = os.environ.get("BRANCH_NAME", "").strip()
          base_ref = os.environ.get("BASE_REF", "").strip()
          check_pr_title = os.environ.get("CHECK_PR_TITLE", "true").lower() == "true"
          check_branch = os.environ.get("CHECK_BRANCH", "true").lower() == "true"
          check_commits = os.environ.get("CHECK_COMMITS", "true").lower() == "true"
          check_pr_body = os.environ.get("CHECK_PR_BODY", "true").lower() == "true"

          CONVENTION_LINK = "https://github.com/DPYB/.github/blob/main/docs/02-git-conventions.md"
          TITLE_PATTERN = r"^(feat|fix|refactor|chore|test|docs|style)(\[[a-zA-Z0-9_\-]+\])?: .+"
          BRANCH_PATTERN = r"^(feat|fix|chore|refactor|test|docs|style)\/.+"

          errors = []

          print("🔍 DPYB 컨벤션 유효성 검사를 시작합니다...\n")

          # 1. PR Title Check
          if check_pr_title and pr_title:
              print(f"📌 PR 제목 확인: '{pr_title}'")
              if not re.match(TITLE_PATTERN, pr_title):
                  errors.append(
                      f"❌ PR 제목 형식 위반: '{pr_title}'\n"
                      f"   - 올바른 형식: <타입>[적용범위]: <제목(명사형)>\n"
                      f"   - 허용 타입: feat, fix, refactor, chore, test, docs, style\n"
                      f"   - 적용범위: 대괄호 [scope] 형식만 허용 (소괄호 () 사용 불가)\n"
                      f"   - 예시: feat[persona]: 핸드오프 요약 노드 추가"
                  )
              if pr_title.endswith("."):
                  errors.append(f"❌ PR 제목 끝에 마침표(.)는 붙이지 않습니다: '{pr_title}'")

          # 2. Branch Name Check
          if check_branch and branch_name:
              print(f"📌 브랜치명 확인: '{branch_name}'")
              if not re.match(BRANCH_PATTERN, branch_name):
                  errors.append(
                      f"❌ 브랜치명 형식 위반: '{branch_name}'\n"
                      f"   - 올바른 형식: 타입/한글-설명\n"
                      f"   - 허용 타입: feat, fix, chore, refactor, test, docs, style ('feature/' 사용 불가)\n"
                      f"   - 예시: feat/페르소나-핸드오프-그래프, fix/스크랩-널체크"
                  )

          # 3. Commit Messages Check
          if check_commits and base_ref:
              try:
                  cmd = ["git", "log", f"origin/{base_ref}..HEAD", "--format=%s", "--no-merges"]
                  output = subprocess.check_output(cmd, text=True).strip()
                  commits = [c.strip() for c in output.splitlines() if c.strip()]
                  print(f"📌 검사 대상 커밋 수: {len(commits)}개")
                  for commit in commits:
                      if commit.startswith("Merge ") or commit.startswith("Revert "):
                          continue
                      if not re.match(TITLE_PATTERN, commit):
                          errors.append(
                              f"❌ 커밋 메시지 형식 위반: '{commit}'\n"
                              f"   - 올바른 형식: <타입>[적용범위]: <제목(명사형)>\n"
                              f"   - 허용 타입: feat, fix, refactor, chore, test, docs, style\n"
                              f"   - 적용범위: 대괄호 [scope] 형식만 허용 (소괄호 () 사용 불가)\n"
                              f"   - 예시: feat[auth]: 카카오 로그인 토큰 검증 추가"
                          )
                      if commit.endswith("."):
                          errors.append(f"❌ 커밋 메시지 끝에 마침표(.)는 붙이지 않습니다: '{commit}'")
              except Exception as e:
                  print(f"⚠️ 커밋 메시지 조회 중 경고 (무시됨): {e}")

          # 4. PR Body Template Check
          if check_pr_body:
              print("📌 PR 본문(Body) 템플릿 준수 확인...")
              if not pr_body or len(pr_body.strip()) < 30:
                  errors.append(
                      "❌ PR 본문(Description)이 비어있거나 너무 짧습니다 (최소 30자 이상 필요).\n"
                      "   - DPYB Type B PR 템플릿에 맞춰 작업 내용과 체크리스트를 충실히 작성해주세요."
                  )
              else:
                  # 필수 섹션 검사 (작업 요약, 적용 범위, 고려사항, 체크리스트)
                  required_sections = [
                      ("작업 요약", ["## 🎯 작업 요약", "작업 요약", "## 작업 요약"]),
                      ("적용 범위", ["## 🌐 적용 범위", "적용 범위", "## 적용 범위"]),
                      ("고려사항 & 리뷰 포인트", ["## 💬 고려사항 & 리뷰 포인트", "고려사항 & 리뷰 포인트", "## 고려사항", "고려사항"]),
                      ("체크리스트", ["## ✅ 체크리스트", "체크리스트", "## 체크리스트"]),
                  ]
                  missing_sections = []
                  for name, patterns in required_sections:
                      if not any(pattern in pr_body for pattern in patterns):
                          missing_sections.append(name)

                  if missing_sections:
                      errors.append(
                          f"❌ PR 본문에 Type B 필수 섹션이 누락되었습니다: {missing_sections}\n"
                          f"   - 필수 섹션: '## 🎯 작업 요약', '## 🌐 적용 범위', '## 💬 고려사항 & 리뷰 포인트', '## ✅ 체크리스트'\n"
                          f"   - 템플릿 규격에 맞춰 누락된 섹션을 포함해주세요."
                      )

                  # 체크리스트 항목 완료 여부 검사 (최소 1개 이상 [x] 필수)
                  if "- [x]" not in pr_body.lower() and "[x]" not in pr_body.lower():
                      errors.append(
                          "❌ PR 체크리스트 항목이 하나도 완료([x])되지 않았습니다.\n"
                          "   - 로컬 검증 및 하네스 문서(STATE, PLAN, HANDOFF) 갱신을 완료한 뒤 체크박스(- [x])를 체크해주세요."
                      )

                  # 기본 템플릿 플레이스홀더 미작성 방치 검사
                  if re.search(r"-\s*\*\*목적\*\*:\s*$", pr_body, re.MULTILINE) or re.search(r"-\s*\*\*주요 변경사항\*\*:\s*$", pr_body, re.MULTILINE):
                      errors.append(
                          "❌ PR 본문의 '목적' 또는 '주요 변경사항' 플레이스홀더가 비어있습니다.\n"
                          "   - 실제 작업 목적과 변경 내용을 채워넣어주세요."
                      )

                  # 고려사항 & 리뷰 포인트 내용 검사
                  consideration_match = re.search(
                      r"(?:##\s*💬\s*고려사항\s*&\s*리뷰\s*포인트|##\s*고려사항[^\n]*)([\s\S]*?)(?=##|\Z)",
                      pr_body,
                  )
                  if consideration_match:
                      content = consideration_match.group(1)
                      cleaned_content = re.sub(r"<!--[\s\S]*?-->", "", content).strip()
                      cleaned_text = re.sub(r"^[-*]\s*$", "", cleaned_content, flags=re.MULTILINE).strip()
                      if not cleaned_text:
                          errors.append(
                              "❌ PR 본문의 '고려사항 & 리뷰 포인트' 섹션 내용이 비어있습니다.\n"
                              "   - 바이브 코딩 시 고민한 트레이드오프나 리뷰 포인트를 작성해주세요.\n"
                              "   - 특별한 고려사항이 없는 경우 '해당 없음' 또는 '특이사항 없음'을 기재해주세요."
                          )

          if errors:
              print("\n" + "=" * 60)
              print("🚫 컨벤션 검사 실패!")
              print("=" * 60)
              for err in errors:
                  print(f"\n{err}")
              print("\n" + "=" * 60)
              print(f"📖 DPYB Git 컨벤션 가이드: {CONVENTION_LINK}")
              print("=" * 60 + "\n")
              sys.exit(1)

          print("\n✅ 모든 PR 및 커밋 컨벤션 검사를 통과했습니다!")
          EOF
